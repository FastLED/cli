name: Linux x86 Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to validate
        required: true
        type: string
# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Runner selection for the Lint call. pool-select (forge-ci/ci.yml
  # actions/pool-select) reads the forge pool's tokenless status endpoint and
  # answers with the repository variable FORGE_POOL_LABELS (the self-hosted
  # Dell pool, Ubuntu 24.04 image) when the pool has an idle matching runner
  # and the event is trusted: push, workflow_dispatch, or a pull request from
  # this repository. Fork pull requests, an unset variable, or any error give
  # ubuntu-24.04. The selector itself runs on forge-quick
  # (vars.FORGE_QUICK_LABELS), never for a fork pull request. Unset either
  # variable to fall back to hosted.
  pool:
    name: Select runner
    if: >-
      vars.FORGE_POOL_LABELS != ''
      && (github.event_name == 'push'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ vars.FORGE_QUICK_LABELS != '' && fromJSON(vars.FORGE_QUICK_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions: {}
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on || '"ubuntu-24.04"' }}
    steps:
      - name: Select pool or hosted
        id: select
        continue-on-error: true
        uses: forge-ci/ci.yml/actions/pool-select@a36bc81ad6ada5fb17398e3e7ba38435cc67a951
        with:
          labels: ${{ vars.FORGE_POOL_LABELS }}
          fallback: ubuntu-24.04

  verify:
    name: Verify local attestations
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip_call: ${{ steps.plan.outputs.skip_call }}
      skip_unit: ${{ steps.plan.outputs.skip_unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Plan PR gates from the base
        id: plan
        if: hashFiles('ci/prooft_verify.py') != '' && hashFiles('ci-attestations.yml') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --no-project python ci/prooft_verify.py "$BASE_SHA" "$HEAD_SHA" "$PR_TITLE"

  call:
    name: Lint (format, Clippy, Dylint)
    needs: [verify, pool]
    if: ${{ !cancelled() && needs.verify.outputs.skip_call != 'true' }}
    uses: ./.github/workflows/_lint.yml
    with:
      source-sha: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      runs-on: ubuntu-24.04
      # Only a selector that ran has an answer (act passes a skipped job's
      # outputs on unevaluated); otherwise runs-on above applies.
      pool-runs-on: ${{ needs.pool.result == 'success' && needs.pool.outputs.runs-on || '' }}
      run-dylint: true

  unit:
    name: Linux x86 Unit Test
    needs: verify
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci-test') &&
      !contains(github.event.pull_request.labels.*.name, 'ci-full') &&
      needs.verify.outputs.skip_unit != 'true'
    uses: ./.github/workflows/_unit-test.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      runs-on: ubuntu-24.04
