name: Linux x86 Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to validate
        required: true
        type: string
# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify local attestations
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip_call: ${{ steps.plan.outputs.skip_call }}
      skip_unit: ${{ steps.plan.outputs.skip_unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Plan PR gates from the base
        id: plan
        if: hashFiles('ci/prooft_verify.py') != '' && hashFiles('ci-attestations.yml') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --no-project python ci/prooft_verify.py "$BASE_SHA" "$HEAD_SHA" "$PR_TITLE"

  call:
    name: Lint (format, Clippy, Dylint)
    needs: verify
    if: ${{ !cancelled() && needs.verify.outputs.skip_call != 'true' }}
    uses: ./.github/workflows/_lint.yml
    with:
      source-sha: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      runs-on: ubuntu-24.04
      run-dylint: true

  unit:
    name: Linux x86 Unit Test
    needs: verify
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci-test') &&
      !contains(github.event.pull_request.labels.*.name, 'ci-full') &&
      needs.verify.outputs.skip_unit != 'true'
    uses: ./.github/workflows/_unit-test.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}
      runs-on: ubuntu-24.04
